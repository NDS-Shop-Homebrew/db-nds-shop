name: Update UniStore

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    container: rinzler65/nds-shop

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Configure Git to trust the directory
      run: git config --global --add safe.directory /__w/db-nds-shop/db-nds-shop

    - name: Python dependencies
      run: python3 -m pip install -q -r source/requirements.txt

    - name: Delete old pages and QRs
      run: |
        rm -rf frontend/public/_3ds/* frontend/public/_ds/* frontend/public/assets/images/qr/*.png
        mkdir -p frontend/public/assets/images/qr/prerelease frontend/public/assets/images/qr/nightly frontend/public/assets/images/icons frontend/public/assets/images/screenshots frontend/public/unistore frontend/public/data

    - name: Run generate.py (pages + QR + unistore)
      run: |
        export PATH=$PATH:/opt/devkitpro/tools/bin
        python3 source/generate.py source/apps frontend/public --token ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Update frontmatter + games.json
      run: |
        python3 tools/nds-to-cia/update_md_screenshots.py
        cd source && python3 generate_games.py

    - name: Push changes
      run: |
        git config user.email "ndsshopunistore@gmail.com"
        git config user.name "NDS_Shop_Bot"

        git checkout dev
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update UniStore"
          git push "https://x-access-token:${{ secrets.MY_GITHUB_TOKEN }}@github.com/NDS-Shop-Homebrew/db-nds-shop.git" dev
        fi
