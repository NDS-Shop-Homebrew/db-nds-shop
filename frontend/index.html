<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <meta name="description" content="NDS-Shop — Téléchargez des jeux Nintendo DS directement sur votre console 3DS." />
    
    <!-- Open Graph (Facebook / Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NDS-Shop" />
    <meta property="og:title" content="NDS-Shop" />
    <meta property="og:description" content="NDS-Shop — Téléchargez des jeux Nintendo DS directement sur votre console 3DS." />
    <meta property="og:url" content="https://db-nds-shop.fr/" />
    <meta property="og:image" content="https://db-nds-shop.fr/assets/logo.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NDS-Shop" />
    <meta name="twitter:description" content="NDS-Shop — Téléchargez des jeux Nintendo DS directement sur votre console 3DS." />
    <meta name="twitter:image" content="https://db-nds-shop.fr/assets/logo.png" />
    <title>NDS-Shop</title>
    <script>
      (function() {
        const saved = localStorage.getItem('darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'true' || (saved === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
